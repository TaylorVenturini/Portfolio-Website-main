<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <!-- Load the main stylesheet from one folder above -->
  <link rel="stylesheet" href="../style.css">

  <style>
    /* black, like the Week 2 page itself */
    body.preview-page {
      background: #000;
    }

    #chip {
      width: 64vmin;
      height: 64vmin;
      display: block;
      filter: drop-shadow(0 0 3vmin rgba(255, 190, 60, 0.45));
      animation: float 2.4s ease-in-out infinite;
    }

    #chip.bite {
      animation: chomp 0.35s ease-out;
    }

    #chip.gone {
      opacity: 0;
      transition: opacity 0.5s;
    }

    #chip.back {
      opacity: 1;
      transition: opacity 0.5s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(-1.5vmin) rotate(-3deg); }
      50%      { transform: translateY(1.5vmin) rotate(3deg); }
    }

    @keyframes chomp {
      0%   { transform: scale(1); }
      35%  { transform: scale(0.82, 1.1) rotate(-6deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .crumb {
      position: fixed;
      pointer-events: none;
      color: gold;
      text-shadow: 0 0 1.5vmin gold;
      animation: crumb 1.1s ease-out forwards;
    }

    @keyframes crumb {
      from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      to   { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2); }
    }
  </style>
</head>

<body class="preview-page">

  <img id="chip" src="chip-preview.png" alt="">

  <script>
    const chip = document.getElementById("chip");

    // load both pictures first so nothing flickers when we swap
    const whole = new Image();
    whole.src = "chip-preview.png";
    const bitten = new Image();
    bitten.src = "chip-bitten-preview.png";

    function crumbs() {
      const box = chip.getBoundingClientRect();
      const unit = Math.min(window.innerWidth, window.innerHeight);

      // the bite is on the upper right of the chip
      const x = box.left + box.width * 0.82;
      const y = box.top + box.height * 0.26;

      for (let i = 0; i < 22; i++) {
        // mostly down and outward, like real crumbs
        const angle = (10 + Math.random() * 150) * Math.PI / 180;
        const distance = unit * (0.14 + Math.random() * 0.3);

        const star = document.createElement("div");
        star.className = "crumb";
        star.textContent = "✦";
        star.style.left = x + "px";
        star.style.top = y + "px";
        star.style.fontSize = (unit * (0.06 + Math.random() * 0.07)) + "px";
        star.style.color = ["gold", "#fff3b0", "white"][Math.floor(Math.random() * 3)];
        star.style.setProperty("--dx", (Math.cos(angle) * distance) + "px");
        star.style.setProperty("--dy", (Math.sin(angle) * distance) + "px");
        document.body.appendChild(star);
        setTimeout(function () { star.remove(); }, 1200);
      }
    }

    // one loop: whole chip -> bite + crumbs -> fade -> whole chip again
    function loop() {
      chip.src = "chip-preview.png";
      chip.className = "back";

      setTimeout(function () {
        chip.src = "chip-bitten-preview.png";
        chip.className = "bite";
        crumbs();
      }, 1500);

      setTimeout(function () {
        chip.className = "gone";
      }, 3300);

      setTimeout(loop, 3900);
    }

    loop();
  </script>

</body>

</html>
